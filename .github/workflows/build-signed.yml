name: Build Signed Release APK

# ── Triggers ──────────────────────────────────────────────────────────────────
#  • Automatic : push to main / master
#  • Manual    : Actions → "Run workflow" (lets you set key validity in days)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      validity_days:
        description: 'Signing key validity (days, max 9125 = 25 yrs)'
        required: false
        default: '365'
      tag_name:
        description: 'Optional release tag (e.g. v1.0.3) — leave blank to skip'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  #  JOB: build-signed
  # ════════════════════════════════════════════════════════════════════════════
  build-signed:
    name: Assemble Signed Release
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK ───────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Generate a random keystore ────────────────────────────────────────
      #
      #  Everything in this step is ephemeral — a fresh RSA 2048 key is created
      #  every run.  Passwords are masked immediately so they never appear in
      #  any log line, even if a later step echoes $GITHUB_ENV by accident.
      #
      #  To switch to a *persistent* key for Play Store releases:
      #    1. Run the keytool command locally and keep the .jks file.
      #    2. Base-64 encode it:  base64 -w 0 release.jks > release.jks.b64
      #    3. Add these GitHub Secrets to your repo:
      #         KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      #    4. Replace this step with:
      #         run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks
      #       and set the env vars from secrets instead of generating them here.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Generate random signing keystore
        id: keygen
        run: |
          # ── Random credentials ──────────────────────────────────────
          ALIAS="mdc-$(openssl rand -hex 5)"
          KPASS="$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9!@#' | head -c 28)"
          SPASS="$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9!@#' | head -c 28)"
          DAYS="${{ github.event.inputs.validity_days || '365' }}"
          KEYSTORE="$RUNNER_TEMP/release.jks"

          # Mask NOW — before anything else runs or prints
          echo "::add-mask::$KPASS"
          echo "::add-mask::$SPASS"

          # ── Generate keystore ───────────────────────────────────────
          keytool -genkeypair \
            -alias    "$ALIAS" \
            -keyalg    RSA \
            -keysize   2048 \
            -validity  "$DAYS" \
            -keystore  "$KEYSTORE" \
            -storepass "$SPASS" \
            -keypass   "$KPASS" \
            -dname "CN=MotorDrive CI, OU=Build, O=MotorDrive, L=Kozhikode, ST=Kerala, C=IN" \
            -noprompt

          # ── Export to env (passwords are already masked above) ──────
          echo "KEY_ALIAS=$ALIAS"     >> $GITHUB_ENV
          echo "KEY_PASS=$KPASS"      >> $GITHUB_ENV
          echo "STORE_PASS=$SPASS"    >> $GITHUB_ENV
          echo "KEYSTORE=$KEYSTORE"   >> $GITHUB_ENV
          echo "KEY_DAYS=$DAYS"       >> $GITHUB_ENV

          # ── Grab the SHA-256 fingerprint (public info — safe to show) ─
          FINGERPRINT=$(keytool -list -v \
              -keystore "$KEYSTORE" -storepass "$SPASS" \
            | grep "SHA256:" | sed 's/.*SHA256:/SHA256:/' | xargs)
          echo "CERT_FP=$FINGERPRINT" >> $GITHUB_ENV

          echo "Keystore generated — alias: $ALIAS"

      # ── 4. Permissions ───────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 5. Build & sign ──────────────────────────────────────────────────────
      #
      #  The four android.injected.signing.* Gradle properties are the official
      #  AGP mechanism for injecting signing config without touching build files.
      #  They work on all AGP versions (7, 8, 9).
      # ─────────────────────────────────────────────────────────────────────────
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" \
            --stacktrace \
            --no-daemon

      # ── 6. Rename APK to include run number ──────────────────────────────────
      - name: Rename output APK
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          DEST=app/build/outputs/apk/release/MotorDrive-signed-run${{ github.run_number }}.apk
          mv "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> $GITHUB_ENV
          echo "APK_NAME=$(basename $DEST)" >> $GITHUB_ENV

      # ── 7. Verify the APK is actually signed ─────────────────────────────────
      - name: Verify APK signature
        run: |
          # apksigner is bundled with the Android build-tools already on the runner
          # via the setup-java / Android SDK environment
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify \
            --verbose "$APK_PATH" 2>&1 | head -20 || \
          echo "apksigner not found — skipping verify (APK is still signed by Gradle)"

      # ── 8. Upload artifact ───────────────────────────────────────────────────
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MotorDrive-signed-run${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      # ── 9. Job summary ───────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON=$( [ "$STATUS" = "success" ] && echo "✅" || echo "❌" )

          echo "## ${ICON} Signed Release — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Build" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status       | \`$STATUS\`                       |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch       | \`${{ github.ref_name }}\`         |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit       | \`${{ github.sha }}\`              |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.event_name }}         |" >> $GITHUB_STEP_SUMMARY

          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -sh "$APK_PATH" | cut -f1)
            echo "| APK name     | \`$APK_NAME\`    |"              >> $GITHUB_STEP_SUMMARY
            echo "| APK size     | $SIZE               |"           >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔑 Signing Certificate" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Key alias    | \`$KEY_ALIAS\`   |" >> $GITHUB_STEP_SUMMARY
          echo "| Algorithm    | RSA 2048         |" >> $GITHUB_STEP_SUMMARY
          echo "| Validity     | $KEY_DAYS days   |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA-256      | \`$CERT_FP\`     |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
          echo "> **Ephemeral key** — generated fresh this run only." >> $GITHUB_STEP_SUMMARY
          echo "> An APK from a different run cannot update one installed from this run." >> $GITHUB_STEP_SUMMARY
          echo "> For Play Store / persistent distribution, store a keystore as a GitHub Secret (instructions in the workflow file)." >> $GITHUB_STEP_SUMMARY
